<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgriConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module">
    import { createChat } from 'https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js';

    // 1. Generate a random, unique string on refresh
    const freshSessionId = crypto.randomUUID();

    // 2. Initialize the chat
    createChat({
      webhookUrl: 'https://n8n-opvk.onrender.com/webhook/d3d42ea4-6323-495c-b7c7-09075db3cdca/chat',
      loadPreviousSession: false,
      metadata: {
        sessionId: freshSessionId // Pass the fresh ID to your n8n workflow
      },
      initialMessages: [
        'ආයුබෝවන්! 🌿 AgriConnect AI වෙත සාදරයෙන් පිළිගනිමු. ඔබට දැනගැනීමට අවශ්‍ය යමක් ඇත්නම්, කරුණාකර විමසන්න.  \n  \nWelcome to AgriConnect AI! 🌿 If you want to know anything, please feel free to ask.'
      ]
    });

    // Polished chat styling and small DOM enhancements
    (function enhanceChatUi() {
      const css = `
        /* ========== AGRICONNECT CHATBOT — PREMIUM OVERHAUL ========== */

        /* ---------- Container & Panel ---------- */
        .n8n-chat .chat-window-wrapper { z-index: 9999; }
        .n8n-chat .chat-layout {
          border-radius: 20px !important;
          overflow: hidden;
          box-shadow:
            0 25px 60px rgba(0, 0, 0, 0.18),
            0 10px 25px rgba(0, 0, 0, 0.10),
            0 0 0 1px rgba(255, 255, 255, 0.08);
          backdrop-filter: blur(24px) saturate(180%);
          -webkit-backdrop-filter: blur(24px) saturate(180%);
          width: 380px !important;
          max-height: 680px !important;
          transform-origin: bottom right;
          animation: agri-entrance 350ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        /* ---------- Header ---------- */
        .n8n-chat .chat-layout .chat-header {
          background: linear-gradient(135deg, #047857 0%, #059669 40%, #10b981 100%) !important;
          color: #ffffff !important;
          padding: 16px 18px !important;
          display: flex !important;
          gap: 14px !important;
          align-items: center !important;
          position: relative;
          overflow: hidden;
          min-height: 72px;
        }
        /* Decorative shimmer on header */
        .n8n-chat .chat-layout .chat-header::after {
          content: '';
          position: absolute;
          top: -50%;
          right: -20%;
          width: 120px;
          height: 200%;
          background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
          transform: rotate(25deg);
          pointer-events: none;
        }
        .n8n-chat .chat-layout .chat-header h1 {
          font-weight: 700 !important;
          font-size: 1.1rem !important;
          margin: 0 !important;
          letter-spacing: -0.01em;
          text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }
        .n8n-chat .chat-layout .chat-header p {
          margin: 2px 0 0 0 !important;
          opacity: 0.88;
          font-size: 0.78rem !important;
          font-weight: 400;
          letter-spacing: 0.01em;
        }
        /* Close button */
        .n8n-chat .chat-layout .chat-header button,
        .n8n-chat .chat-layout .chat-header .chat-close-button {
          background: rgba(255, 255, 255, 0.15) !important;
          border-radius: 50% !important;
          width: 32px !important;
          height: 32px !important;
          display: flex !important;
          align-items: center !important;
          justify-content: center !important;
          transition: background 200ms, transform 200ms !important;
          border: 1px solid rgba(255, 255, 255, 0.15) !important;
        }
        .n8n-chat .chat-layout .chat-header button:hover,
        .n8n-chat .chat-layout .chat-header .chat-close-button:hover {
          background: rgba(255, 255, 255, 0.25) !important;
          transform: scale(1.08);
        }

        /* ---------- Avatar ---------- */
        .n8n-chat .chat-layout .agri-avatar {
          width: 44px;
          height: 44px;
          border-radius: 50%;
          flex: 0 0 44px;
          background: linear-gradient(135deg, #34d399, #10b981);
          display: inline-flex;
          align-items: center;
          justify-content: center;
          overflow: hidden;
          box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15), 0 0 0 3px rgba(255, 255, 255, 0.2);
          position: relative;
        }
        .n8n-chat .chat-layout .agri-avatar::after {
          content: '';
          position: absolute;
          bottom: 2px;
          right: 2px;
          width: 10px;
          height: 10px;
          background: #4ade80;
          border-radius: 50%;
          border: 2px solid #047857;
          animation: agri-status-pulse 2s ease-in-out infinite;
        }
        .n8n-chat .chat-layout .agri-avatar img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          display: block;
        }

        /* ---------- Messages Area ---------- */
        .n8n-chat .chat-messages-wrapper,
        .n8n-chat .chat-layout .chat-messages {
          background: linear-gradient(180deg, #f0fdf4 0%, #ffffff 25%, #fafafa 100%) !important;
          padding: 16px 14px !important;
        }

        /* Message bubbles */
        .n8n-chat .chat-message {
          max-width: 82% !important;
          padding: 11px 15px !important;
          font-size: 0.875rem !important;
          line-height: 1.55 !important;
          transition: transform 150ms ease, opacity 150ms ease;
          animation: agri-msg-in 250ms ease-out both;
        }
        .n8n-chat .chat-message--from-me {
          background: linear-gradient(135deg, #059669, #10b981) !important;
          color: #ffffff !important;
          border-radius: 18px 18px 6px 18px !important;
          box-shadow: 0 3px 12px rgba(16, 185, 129, 0.25) !important;
          margin-left: auto !important;
        }
        .n8n-chat .chat-message--from-other {
          background: #ffffff !important;
          color: #1f2937 !important;
          border-radius: 18px 18px 18px 6px !important;
          box-shadow: 0 1px 5px rgba(0, 0, 0, 0.06), 0 0 0 1px rgba(0, 0, 0, 0.04) !important;
          border: 1px solid rgba(229, 231, 235, 0.5) !important;
        }

        /* Message hover micro-interaction */
        .n8n-chat .chat-message:hover {
          transform: translateY(-1px);
        }

        /* ---------- Input Area ---------- */
        .n8n-chat .chat-layout .chat-input {
          padding: 12px 14px 14px !important;
          background: rgba(255, 255, 255, 0.98) !important;
          border-top: 1px solid rgba(229, 231, 235, 0.5) !important;
        }
        .n8n-chat .chat-layout .chat-input textarea,
        .n8n-chat .chat-layout .chat-input input {
          background: #f3f4f6 !important;
          border: 1px solid rgba(229, 231, 235, 0.8) !important;
          border-radius: 14px !important;
          padding: 10px 14px !important;
          font-size: 0.875rem !important;
          transition: border-color 200ms, box-shadow 200ms !important;
          color: #1f2937 !important;
        }
        .n8n-chat .chat-layout .chat-input textarea:focus,
        .n8n-chat .chat-layout .chat-input input:focus {
          border-color: #10b981 !important;
          box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.12) !important;
          outline: none !important;
        }
        .n8n-chat .chat-layout .chat-input .chat-send-button {
          background: linear-gradient(135deg, #059669, #10b981) !important;
          color: #ffffff !important;
          border-radius: 12px !important;
          padding: 9px 14px !important;
          transition: transform 200ms, box-shadow 200ms !important;
          box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3) !important;
          border: none !important;
        }
        .n8n-chat .chat-layout .chat-input .chat-send-button:hover {
          transform: scale(1.06) !important;
          box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4) !important;
        }
        .n8n-chat .chat-layout .chat-input .chat-send-button:active {
          transform: scale(0.96) !important;
        }

        /* ---------- Toggle Button (FAB) ---------- */
        .n8n-chat .chat-window-toggle {
          right: 24px !important;
          bottom: 24px !important;
          border-radius: 50% !important;
          width: 60px !important;
          height: 60px !important;
          padding: 0 !important;
          display: flex !important;
          align-items: center !important;
          justify-content: center !important;
          background: linear-gradient(135deg, #059669, #10b981) !important;
          box-shadow:
            0 8px 32px rgba(16, 185, 129, 0.35),
            0 4px 12px rgba(0, 0, 0, 0.12) !important;
          transition: transform 250ms cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 250ms !important;
          animation: agri-fab-pulse 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
          border: none !important;
        }
        .n8n-chat .chat-window-toggle:hover {
          transform: translateY(-3px) scale(1.06) !important;
          box-shadow:
            0 12px 36px rgba(16, 185, 129, 0.4),
            0 6px 16px rgba(0, 0, 0, 0.15) !important;
        }
        .n8n-chat .chat-window-toggle:active {
          transform: scale(0.95) !important;
        }
        .n8n-chat .chat-window-toggle svg {
          width: 26px !important;
          height: 26px !important;
        }

        /* ---------- Scrollbar ---------- */
        .n8n-chat .chat-messages-wrapper::-webkit-scrollbar,
        .n8n-chat .chat-layout .chat-messages::-webkit-scrollbar {
          width: 5px;
        }
        .n8n-chat .chat-messages-wrapper::-webkit-scrollbar-track,
        .n8n-chat .chat-layout .chat-messages::-webkit-scrollbar-track {
          background: transparent;
        }
        .n8n-chat .chat-messages-wrapper::-webkit-scrollbar-thumb,
        .n8n-chat .chat-layout .chat-messages::-webkit-scrollbar-thumb {
          background: rgba(0, 0, 0, 0.12);
          border-radius: 999px;
        }
        .n8n-chat .chat-messages-wrapper::-webkit-scrollbar-thumb:hover,
        .n8n-chat .chat-layout .chat-messages::-webkit-scrollbar-thumb:hover {
          background: rgba(0, 0, 0, 0.22);
        }

        /* ---------- Greeting / Initial Messages ---------- */
        .n8n-chat .chat-layout .chat-greeting,
        .n8n-chat .chat-layout .chat-new-session-button {
          border-radius: 14px !important;
          font-size: 0.875rem !important;
        }
        .n8n-chat .chat-layout .chat-new-session-button {
          background: linear-gradient(135deg, #059669, #10b981) !important;
          color: #ffffff !important;
          border: none !important;
          padding: 10px 20px !important;
          border-radius: 12px !important;
          font-weight: 600 !important;
          box-shadow: 0 3px 12px rgba(16, 185, 129, 0.25) !important;
          transition: transform 200ms, box-shadow 200ms !important;
        }
        .n8n-chat .chat-layout .chat-new-session-button:hover {
          transform: scale(1.03) !important;
          box-shadow: 0 5px 16px rgba(16, 185, 129, 0.35) !important;
        }

        /* ---------- Powered-by footer ---------- */
        .n8n-chat .chat-layout footer,
        .n8n-chat .chat-layout .chat-footer {
          background: rgba(255, 255, 255, 0.95) !important;
          border-top: 1px solid rgba(229, 231, 235, 0.3) !important;
          font-size: 0.7rem !important;
          color: #9ca3af !important;
          padding: 6px 14px !important;
        }

        /* ---------- Animations ---------- */
        @keyframes agri-entrance {
          from {
            transform: translateY(16px) scale(0.92);
            opacity: 0;
          }
          to {
            transform: translateY(0) scale(1);
            opacity: 1;
          }
        }

        @keyframes agri-msg-in {
          from {
            opacity: 0;
            transform: translateY(8px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }

        @keyframes agri-fab-pulse {
          0% {
            box-shadow:
              0 8px 32px rgba(16, 185, 129, 0.35),
              0 4px 12px rgba(0, 0, 0, 0.12),
              0 0 0 0 rgba(16, 185, 129, 0.4);
          }
          70% {
            box-shadow:
              0 8px 32px rgba(16, 185, 129, 0.35),
              0 4px 12px rgba(0, 0, 0, 0.12),
              0 0 0 14px rgba(16, 185, 129, 0);
          }
          100% {
            box-shadow:
              0 8px 32px rgba(16, 185, 129, 0.35),
              0 4px 12px rgba(0, 0, 0, 0.12),
              0 0 0 0 rgba(16, 185, 129, 0);
          }
        }

        @keyframes agri-status-pulse {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.6; transform: scale(0.85); }
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 480px) {
          .n8n-chat .chat-layout {
            width: calc(100vw - 16px) !important;
            max-height: calc(100vh - 60px) !important;
            border-radius: 16px !important;
          }
          .n8n-chat .chat-window-toggle {
            right: 16px !important;
            bottom: 16px !important;
            width: 52px !important;
            height: 52px !important;
          }
        }
        `;

      const style = document.createElement('style'); style.textContent = css; document.head.appendChild(style);

      // Robot avatar (premium SVG data URI)
      const robotSvg = encodeURIComponent(`
          <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'>
            <defs>
              <linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>
                <stop offset='0' stop-color='%23ffffff' stop-opacity='0.95'/>
                <stop offset='1' stop-color='%23d1fae5' stop-opacity='0.9'/>
              </linearGradient>
            </defs>
            <rect x='14' y='18' width='36' height='28' rx='10' fill='url(%23g)'/>
            <rect x='20' y='24' width='24' height='14' rx='7' fill='%23047857' opacity='0.12'/>
            <circle cx='26' cy='31' r='3' fill='%23047857'/>
            <circle cx='38' cy='31' r='3' fill='%23047857'/>
            <circle cx='26' cy='30' r='1' fill='%23ffffff'/>
            <circle cx='38' cy='30' r='1' fill='%23ffffff'/>
            <path d='M28 37 Q32 40 36 37' stroke='%23047857' stroke-width='2' fill='none' stroke-linecap='round'/>
            <rect x='30' y='8' width='4' height='10' rx='2' fill='%2310b981'/>
            <circle cx='32' cy='7' r='3.5' fill='%2334d399'/>
            <circle cx='32' cy='7' r='1.5' fill='%23ffffff'/>
          </svg>
        `);
      const avatarUrl = `data:image/svg+xml;utf8,${robotSvg}`;

      // Wait for the widget header then inject avatar + branding
      const MAX = 80; let attempts = 0;
      const id = setInterval(() => {
        attempts += 1;
        const header = document.querySelector('.n8n-chat .chat-layout .chat-header');
        if (header) {
          // Avoid duplicating
          if (!header.querySelector('.agri-avatar')) {
            const wrap = document.createElement('div'); wrap.className = 'agri-avatar';
            const img = document.createElement('img'); img.src = avatarUrl; img.alt = 'AgriBot'; wrap.appendChild(img);
            header.prepend(wrap);
          }

          const title = header.querySelector('h1'); if (title) title.textContent = 'AgriBot';
          const subtitle = header.querySelector('p'); if (subtitle) subtitle.textContent = 'AI Farming Assistant • Online';

          clearInterval(id);
        }
        if (attempts > MAX) clearInterval(id);
      }, 120);

      // Re-apply header changes if widget re-renders
      const observer = new MutationObserver(() => {
        const header = document.querySelector('.n8n-chat .chat-layout .chat-header');
        if (header && !header.querySelector('.agri-avatar')) {
          const wrap = document.createElement('div'); wrap.className = 'agri-avatar';
          const img = document.createElement('img'); img.src = avatarUrl; img.alt = 'AgriBot'; wrap.appendChild(img);
          header.prepend(wrap);
          const title = header.querySelector('h1'); if (title) title.textContent = 'AgriBot';
          const subtitle = header.querySelector('p'); if (subtitle) subtitle.textContent = 'AI Farming Assistant • Online';
        }
      });
      observer.observe(document.documentElement, { childList: true, subtree: true });
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
